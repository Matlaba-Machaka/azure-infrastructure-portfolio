#cloud-config
package_update: true
packages:
  - nginx
  - stress
write_files:
  - path: /var/www/html/index.html
    content: |
      <h1>Azure VMSS High-Availability Web Tier</h1>
      <p>Provisioned via Cloud-Init across Availability Zones</p>
runcmd:
  - systemctl enable nginx
  - systemctl restart nginx
